<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Fuel Consumption Analytics</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>🚛 Cloud-Based Fleet Fuel Consumption Analytics</h1>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <h3 id="total-fuel">--</h3>
        <p>Total Fuel Used</p>
      </div>
      <div class="card">
        <h3 id="total-cost">--</h3>
        <p>Total Fuel Cost</p>
      </div>
      <div class="card">
        <h3 id="total-vehicles">--</h3>
        <p>Vehicles Tracked</p>
      </div>
      <div class="card">
        <h3 id="total-logs">--</h3>
        <p>Fuel Log Entries</p>
      </div>
    </section>

    <section class="chart-section">
      <h2>Monthly Fuel Consumption</h2>
      <canvas id="monthlyChart" height="90"></canvas>
    </section>

    <section class="table-section">
      <h2>Fleet Vehicles</h2>
      <table id="vehicles-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Make / Model</th>
            <th>Year</th>
            <th>Fuel Type</th>
            <th>Analytics</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="vehicle-detail" class="detail-section"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
