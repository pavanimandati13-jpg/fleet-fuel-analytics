
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud-Based Fleet Fuel Consumption Analytics</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Load Chart.js from the project itself -->
  <script src="js/chart.umd.min.js"></script>

  <!-- Load dashboard code after Chart.js -->
  <script defer src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>🚛 Cloud-Based Fleet Fuel Consumption Analytics</h1>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <h3 id="total-fuel">Loading...</h3>
        <p>Total Fuel Used</p>
      </div>
      <div class="card">
        <h3 id="total-cost">Loading...</h3>
        <p>Total Fuel Cost</p>
      </div>
      <div class="card">
        <h3 id="total-vehicles">Loading...</h3>
        <p>Vehicles Tracked</p>
      </div>
      <div class="card">
        <h3 id="total-logs">Loading...</h3>
        <p>Fuel Log Entries</p>
      </div>
    </section>

    <section class="chart-section">
      <h2>Monthly Fuel Consumption</h2>
      <div style="position:relative;width:100%;height:350px;">
        <canvas id="monthlyChart"
          role="img"
          aria-label="Monthly fuel consumption line chart"></canvas>
      </div>
    </section>

    <section class="table-section">
      <h2>Fleet Vehicles</h2>
      <table id="vehicles-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Make / Model</th>
            <th>Year</th>
            <th>Fuel Type</th>
            <th>Analytics</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5">Loading vehicles...</td></tr>
        </tbody>
      </table>
    </section>

    <section id="vehicle-detail" class="detail-section"></section>
  </main>
</body>
</html>
